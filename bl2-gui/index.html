<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>BL2 Save Viewer</title>

    <!-- Trunk compiles this crate to WASM and injects the loader here. -->
    <link data-trunk rel="rust" data-wasm-opt="2" />

    <style>
        html, body {
            overflow: hidden;
            margin: 0 !important;
            padding: 0 !important;
            height: 100%;
            width: 100%;
        }
        body { background: #909090; }
        @media (prefers-color-scheme: dark) { body { background: #404040; } }
        canvas {
            margin: 0 auto;
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        #loading_text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-family: sans-serif;
            color: #f0f0f0;
        }
    </style>
</head>

<body>
    <canvas id="the_canvas_id"></canvas>
    <p id="loading_text">Loading…</p>
</body>

</html>
