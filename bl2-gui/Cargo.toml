[package]
name = "bl2-gui"
version = "0.2.1"
edition = "2021"
description = "Borderlands 2 save editor UI (egui/eframe) — builds native and web/WASM."

[dependencies]
bl2-save = { workspace = true }
egui = "0.34"
# "persistence" adds eframe's Storage (RON file on native, localStorage on web)
# so the last-used theme + look survive restarts.
eframe = { version = "0.34", features = ["persistence"] }
log = "0.4"

# Native file open/save dialogs (GTK backend on Linux; native dialogs on Win/Mac).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rfd = "0.14"

# Web-only: wasm entry point, DOM access, "download edited save", file-open picker.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Blob", "Url", "HtmlAnchorElement"] }
rfd = "0.14"
