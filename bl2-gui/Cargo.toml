[package]
name = "bl2-gui"
version = "0.1.0"
edition = "2021"
description = "Read-only Borderlands 2 save viewer (egui/eframe) — builds native and web/WASM."

[dependencies]
bl2-save = { workspace = true }
egui = "0.34"
eframe = "0.34"
log = "0.4"

# Web-only: wasm entry point + DOM access (used by src/main.rs under wasm32).
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"
web-sys = "0.3"
