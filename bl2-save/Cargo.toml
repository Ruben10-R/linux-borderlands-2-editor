[package]
name = "bl2-save"
version = "0.2.0"
edition = "2021"
description = "Borderlands 2 save-file core: LZO/Huffman/CRC codec + surgical field editing."

[dependencies]
lzokay-native = { workspace = true }
sha1 = { workspace = true }
crc32fast = { workspace = true }
thiserror = { workspace = true }
serde_json = { workspace = true }
# Random Save GUID for freshly-created characters.
getrandom = "0.2"

# On web, getrandom needs the browser-crypto backend.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

[dev-dependencies]
# Test-only: the game uses a C LZO1x decompressor. We cross-check that our
# (pure-Rust lzokay) compressed output is decodable by this canonical C impl,
# which is a strong proxy for the game accepting it. Not shipped, not built for WASM.
minilzo-rs = "0.6"
