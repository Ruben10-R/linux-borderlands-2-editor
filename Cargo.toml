[workspace]
resolver = "2"
members = ["bl2-save", "bl2-cli", "bl2-gui", "poc-roundtrip"]
# bl2-gui is excluded from the default set: `cargo build`/`test` (no -p) skips it,
# because the NATIVE GUI needs system GL/X11 libs not present in the plain `rust:1`
# image. Build it explicitly (`-p bl2-gui`) or via trunk/docker-compose (web/WASM).
default-members = ["bl2-save", "bl2-cli", "poc-roundtrip"]

# Shared dependency versions, so every crate stays in lockstep.
[workspace.dependencies]
lzokay-native = "0.1"   # pure-Rust LZO1x (compiles to WASM; no C dependency)
sha1 = "0.10"
crc32fast = "1.4"
clap = { version = "4", features = ["derive"] }
thiserror = "2"
bl2-save = { path = "bl2-save" }
